name: calorie_tracker_ai
description: Personal Android AI Calorie & Macro Tracker with SQLite local storage and Google Drive auto-backup.
publish_to: 'none'
version: 0.1.5+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI, Material 3 Expressive & Fonts
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2785.1
  fl_chart: ^0.69.0
  intl: ^0.19.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Offline-First Local SQLite Database
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

  # Google Sign-In & Google Drive appDataFolder Auto-Backup
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Multi-Provider AI (Google Gemini + OpenAI) & HTTP
  google_generative_ai: ^0.4.6
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

  # Camera & Barcode Scanner (OpenFoodFacts)
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
